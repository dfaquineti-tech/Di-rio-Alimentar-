<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769aa"><link rel="manifest" href="./manifest.webmanifest"><title>Histórico · Diário Alimentar</title><style>
:root{--blue:#1769aa;--blue2:#0d47a1;--gray:#eef1f5;--dark:#263238;--muted:#66737d;--red:#c62828;--green:#2e7d32}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--gray);color:var(--dark)}header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:18px;border-radius:0 0 22px 22px}header h1{margin:0 0 4px;font-size:23px}header div{font-size:13px;opacity:.86}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000010;animation:in .35s ease both}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{border:0;border-radius:11px;min-height:44px;font-weight:700;background:#e1e6eb;color:var(--dark)}.tabs button.active{background:var(--blue);color:#fff}.back{border:0;border-radius:11px;padding:11px 13px;min-height:44px;background:#e1e6eb;color:var(--dark);font-weight:700}.muted{color:var(--muted);font-size:13px}.big{font-size:28px;font-weight:800}.chartWrap{width:100%;overflow-x:auto}.chart{min-width:620px;height:300px;position:relative;border-left:1px solid #cfd5db;border-bottom:1px solid #cfd5db;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,#e8ebee 60px)}.bars{position:absolute;inset:10px 10px 0 10px;display:flex;align-items:flex-end;gap:8px}.day{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.bar{width:100%;height:0;background:var(--blue);border-radius:7px 7px 0 0;transition:height .6s ease}.day span{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue);margin-right:4px}.metric{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:10px 0}.track{height:12px;background:#dfe4e9;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:20px}.value{text-align:right;font-weight:700}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 5px;border-bottom:1px solid #e8ebee;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.empty{text-align:center;color:var(--muted);padding:30px 10px}.hint{padding:10px;border-radius:10px;background:#f6f8fa;color:var(--muted);font-size:12px}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body><header><h1>Histórico</h1><div>Veja sua evolução de macros, calorias e água</div></header><main><section class="card"><button class="back" id="back">← Voltar ao diário</button></section><section class="card"><div class="tabs"><button id="week" class="active">Semana</button><button id="month">Mês</button></div></section><section class="card"><div class="row"><div><div class="muted" id="rangeLabel">Últimos 7 dias</div><div class="big" id="avgKcal">0 kcal</div></div><div class="muted">média de calorias</div></div><div class="hint" style="margin-top:10px">O histórico é salvo automaticamente por dia neste aparelho.</div></section><section class="card"><div class="row"><b style="font-size:20px">Calorias por dia</b><span class="muted">kcal</span></div><div class="chartWrap"><div class="chart"><div class="bars" id="bars"></div></div></div></section><section class="card"><div class="row"><b style="font-size:20px">Macros por dia</b><span class="muted">g</span></div><div id="metrics"></div></section><section class="card"><div class="row"><b style="font-size:20px">Tabela do período</b><span class="muted" id="periodCount"></span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Data</th><th>Kcal</th><th>Prot.</th><th>Carb.</th><th>Gord.</th><th>Água</th></tr></thead><tbody id="tableBody"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);let history=JSON.parse(localStorage.getItem("history")||"{}");let current="week";
function allDays(){let out=[];const d=new Date();d.setUTCHours(0,0,0,0);for(let i=0;i<30;i++){const x=new Date(d);x.setUTCDate(d.getUTCDate()-i);const key=x.toISOString().slice(0,10);out.push(history[key]||{date:key,kcal:0,protein:0,carbs:0,fat:0,water:0})}return out.reverse()}
function fmtDate(s){const [y,m,d]=s.split("-");return d+"/"+m}function render(){history=JSON.parse(localStorage.getItem("history")||"{}");const days=allDays().slice(current==="week"?-7:-30);$("rangeLabel").textContent=current==="week"?"Últimos 7 dias":"Últimos 30 dias";$("periodCount").textContent=days.length+" dias";const avg=days.reduce((a,x)=>a+Number(x.kcal||0),0)/days.length;$("avgKcal").textContent=Math.round(avg).toLocaleString("pt-BR")+" kcal";
const max=Math.max(...days.map(x=>Number(x.kcal||0)),1);$("bars").innerHTML=days.map(x=>{const h=Math.max(1,Number(x.kcal||0)/max*255);return `<div class="day" title="${fmtDate(x.date)}: ${Math.round(x.kcal||0)} kcal"><div class="bar" style="height:${h}px"></div><span>${fmtDate(x.date)}</span></div>`}).join("");
const sums=days.reduce((a,x)=>{a.p+=Number(x.protein||0);a.c+=Number(x.carbs||0);a.f+=Number(x.fat||0);return a},{p:0,c:0,f:0});const n=days.length;const avgM={p:sums.p/n,c:sums.c/n,f:sums.f/n};const goals=(days.find(x=>x.macroGoals)||{}).macroGoals||{p:200,c:250,f:78};$("metrics").innerHTML=[["Proteína",avgM.p,goals.p],["Carboidratos",avgM.c,goals.c],["Gorduras",avgM.f,goals.f]].map(r=>`<div class="metric"><b>${r[0]}</b><div class="track"><div class="fill" style="width:${Math.min(100,r[1]/Math.max(r[2],1)*100)}%"></div></div><div class="value">${r[1].toFixed(1)} / ${r[2]} g</div></div>`).join("");
$("tableBody").innerHTML=days.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${Math.round(x.kcal||0)}</td><td>${Number(x.protein||0).toFixed(1)}</td><td>${Number(x.carbs||0).toFixed(1)}</td><td>${Number(x.fat||0).toFixed(1)}</td><td>${(Number(x.water||0)/1000).toFixed(1).replace('.',',')} L</td></tr>`).join("")}
$("week").onclick=()=>{current="week";$("week").classList.add("active");$("month").classList.remove("active");render()};$("month").onclick=()=>{current="month";$("month").classList.add("active");$("week").classList.remove("active");render()};$("back").onclick=()=>location.href="./index.html";render();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
